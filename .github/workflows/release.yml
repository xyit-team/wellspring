# 发布时把 plugins/ 下的官方插件打成 zip，附到 GitHub Release。
#
# 入口：
#   1. 推 v* 标签：自动打包并创建/更新同名 Release
#   2. 手动触发：只打包上传 workflow artifact；勾选 create-release 时也写 Release
#
# zip 内容：
#   - package.json / index.ts 等文件在 zip 根目录，wellspring plugin install 可直接安装
#   - 带根目录 LICENSE
#   - 不含 node_modules / .ui-review / frontend/dist；依赖由安装端按 packageManager 自动安装
#
# 插件版本以各自 package.json 的 version 为准（setup() 里写的 version 会被宿主覆盖）：
# 改动过 plugins/<name>/ 的代码就必须涨版本，否则同一个文件名会对应不同内容，
# plugin list 与 SHA256SUMS 都分辨不出新旧。校验见「校验插件版本」。
# npm 包发布由 publish-npm.yml 负责，本工作流只产 Release 产物。

name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            create-release:
                description: 手动触发时也创建/更新 Release
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    package:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  # 校验插件版本要跟上一个 tag 比对，浅克隆里没有 tag 与历史
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: 核对标签与 package.json 的版本
              if: github.event_name == 'push'
              run: |
                  set -e
                  tag="${{ github.ref_name }}"
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "标签是 $tag，但 package.json 里是 $version"
                    exit 1
                  fi
                  echo "版本对得上：$tag"

            - name: 校验插件版本
              # 改动过某个插件的代码，就必须涨它的 package.json version
              if: github.event_name == 'push'
              run: |
                  set -euo pipefail
                  if ! base="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null)"; then
                    echo "没有上一个 tag，跳过插件版本校验"
                    exit 0
                  fi
                  echo "与 $base 比对"
                  node scripts/check-plugin-versions.mjs --base "$base"

            - name: 打包官方插件
              run: |
                  set -euo pipefail
                  rm -rf release
                  mkdir -p release
                  count=0
                  for dir in plugins/*/; do
                    test -f "${dir}package.json" || continue
                    name="$(node -p "require('./${dir}package.json').name")"
                    version="$(node -p "require('./${dir}package.json').version")"
                    # 用绝对路径：下面要 cd 进插件目录，相对路径会解析到插件目录里
                    out="$PWD/release/${name}-${version}.zip"
                    (
                      cd "$dir"
                      # 内容相同就要打出相同字节：固定 mtime 并去掉额外字段，
                      # SHA256SUMS 才能用来判断两版是不是同一份内容
                      find . -name node_modules -prune -o -exec touch -t 200001010000 {} +
                      zip -qrX "$out" . \
                        -x 'node_modules/*' '*/node_modules/*' \
                           '.git/*' '*/.git/*' \
                           '*/.ui-review/*' \
                           '*/frontend/dist/*' \
                           '*.log'
                    )
                    # 插件目录里没有根 LICENSE，统一带上仓库的 MIT 许可证；
                    # 副本必须固定 mtime，直接 -j 追加会带上当前时间，两次打包字节就不同
                    license_dir="$(mktemp -d)"
                    cp LICENSE "$license_dir/LICENSE"
                    touch -t 200001010000 "$license_dir/LICENSE"
                    zip -qjX "$out" "$license_dir/LICENSE"
                    rm -rf "$license_dir"
                    if ! unzip -Z1 "$out" | grep -qx 'package.json'; then
                      echo "${out} 缺少根目录 package.json"
                      exit 1
                    fi
                    if unzip -Z1 "$out" | grep -q 'node_modules/'; then
                      echo "${out} 不应包含 node_modules"
                      exit 1
                    fi
                    if unzip -Z1 "$out" | grep -qE '^(\.ui-review|frontend/dist)/'; then
                      echo "${out} 不应包含 .ui-review 或 frontend/dist"
                      exit 1
                    fi
                    echo "${out}"
                    count=$((count + 1))
                  done
                  test "$count" -gt 0
                  sha256sum release/*.zip > release/SHA256SUMS
                  # 插件清单：跨 Release 一眼看出哪个插件换了版本
                  {
                    echo "| 插件 | 版本 | sha256 |"
                    echo "| --- | --- | --- |"
                    for dir in plugins/*/; do
                      test -f "${dir}package.json" || continue
                      name="$(node -p "require('./${dir}package.json').name")"
                      version="$(node -p "require('./${dir}package.json').version")"
                      sha="$(sha256sum "release/${name}-${version}.zip" | cut -d' ' -f1)"
                      echo "| ${name} | ${version} | ${sha:0:16} |"
                    done
                  } > release/PLUGINS.md
                  cat release/PLUGINS.md
                  cat release/SHA256SUMS
                  ls -lh release

            - uses: actions/upload-artifact@v7
              with:
                  name: release-plugins-${{ github.sha }}
                  path: release/*
                  if-no-files-found: error

    release:
        needs: package
        # 推标签时自动创建；手动触发默认只上传 artifact，且只能在 tag ref 上建 Release
        if: ${{ (github.event_name == 'push' || inputs.create-release) && startsWith(github.ref, 'refs/tags/') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v7
              with:
                  name: release-plugins-${{ github.sha }}
                  path: assets

            - name: 创建或更新 Release 并附上插件 zip
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  repo="$GITHUB_REPOSITORY"
                  files=(assets/*.zip assets/SHA256SUMS assets/PLUGINS.md)
                  for file in "${files[@]}"; do
                    test -f "$file" || { echo "缺少产物：$file"; exit 1; }
                  done
                  ls -lh "${files[@]}"
                  if gh release view "$TAG" -R "$repo" >/dev/null 2>&1; then
                    gh release upload "$TAG" "${files[@]}" -R "$repo" --clobber
                  else
                    gh release create "$TAG" -R "$repo" \
                      --title "$TAG" \
                      --generate-notes \
                      "${files[@]}"
                  fi
                  gh release view "$TAG" -R "$repo" --json url --jq .url
